<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Andrew</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: white;
      text-shadow: 2px 2px 5px #000;
      overflow: hidden;
    }

        body {
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-size: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
        background-image: url('https://wallpapercave.com/wp/wp6204950.jpg');
      margin: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background-size: cover;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      text-shadow: 2px 2px 5px #000;
    }


    .card {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 2em;
      border-radius: 20px;
      max-width: 90%;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 0.5em;
    }

    h2 {
      margin-top: 0;
    }

    .redeem-btn {
      background-color: yellow;
      color: black;
      padding: 1em 2em;
      font-size: 1.5em;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .redeem-btn:hover {
      transform: scale(1.1);
    }

    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .popup-content {
      background: #222;
      padding: 2em;
      border-radius: 15px;
      text-align: center;
      color: white;
      max-width: 90%;
    }

    .code-box {
      background: #444;
      padding: 1em;
      margin: 1em 0;
      border-radius: 10px;
      font-size: 1.2em;
      user-select: all;
    }

    .popup button {
      margin-top: 1em;
      background-color: #00ff88;
      color: #000;
      border: none;
      padding: 0.8em 1.5em;
      font-size: 1em;
      border-radius: 10px;
      cursor: pointer;
    }

    .popup button.copy-btn {
      background: #ffcc00;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 HAPPY BIRTHDAY ANDREW! 🎂</h1>
    <h2>10 DOLLARS IN ROBLOX</h2>
    <p>You’ve unlocked your Robux reward!</p>
    <button class="redeem-btn" onclick="showPopup()">REDEEM</button>
  </div>

  <div class="popup" id="popup">
    <div class="popup-content">
      <h2>🎁 Your Robux Code</h2>
      <div class="code-box" id="codeBox1">Loading...</div>
      <div class="code-box" id="codeBox2">Loading...</div>
      <button class="copy-btn" onclick="copyCode()">Copy Code</button>
      <button onclick="goToRedeem()">Go to Redeem</button>
    </div>
  </div>

  <script>
    async function fetchTXT(domain) {
      const url = `https://cloudflare-dns.com/dns-query?name=${domain}&type=TXT`;
      const response = await fetch(url, {
        headers: {
          'Accept': 'application/dns-json'
        }
      });
      const data = await response.json();
      const txt = data.Answer?.find(record => record.type === 16);
      return txt ? txt.data.replace(/^"|"$/g, '') : 'Error loading';
    }

    async function showPopup() {
      document.getElementById('popup').style.display = 'flex';

      // Fetch TXT records
      const rcode = await fetchTXT("rcode.project-zero.site");
      const scode = await fetchTXT("scode.project-zero.site");

      // Display codes
      document.getElementById('codeBox1').innerText = rcode;
      document.getElementById('codeBox2').innerText = scode;
    }

    function copyCode() {
      const code1 = document.getElementById('codeBox1').innerText;
      navigator.clipboard.writeText(`${code1}}`).then(() => {
        alert("Code copied!");
      });
    }

    function goToRedeem() {
      window.location.href = "https://www.roblox.com/redeem";
    }
  </script>
</body>
</html>
